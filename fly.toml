# Fly.io configuration for the SchemeGPT API container.
# Deploy: fly launch --no-deploy --copy-config, then fly secrets set
# GROQ_API_KEY=... DATABASE_URL=...  (see docs/DEPLOY.md), then fly deploy.
#
# The machine runs uvicorn with a baked-in 470 MB embedding model; 1 GB RAM
# was too tight under concurrent first-loads, hence 2 GB shared CPU (the
# smallest comfortable size; scale down only after measuring).

app = "schemegpt-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # DATABASE_URL and GROQ_API_KEY are set via `fly secrets set`, never here.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
