name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    name: Data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m py_compile app/*.py scripts/validate_data.py eval/run_eval.py streamlit_app.py
      - name: Validate corpus (stdlib-only)
        run: python scripts/validate_data.py

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch keeps the CI install small and fast; requirements.txt
      # leaves torch unpinned (transitive via sentence-transformers), so the
      # preinstalled wheel satisfies it.
      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (no DB, no Groq, no model downloads)
        run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
