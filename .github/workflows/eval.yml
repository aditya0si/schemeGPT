name: Deterministic RAG quality gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "data/**"
      - "eval/**"
      - "tests/test_retrieval*.py"
      - "requirements*.txt"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "eval/**"
      - "tests/test_retrieval*.py"
      - "requirements*.txt"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

concurrency:
  group: retrieval-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scheme
          POSTGRES_PASSWORD: scheme
          POSTGRES_DB: schemegpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheme -d schemegpt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://scheme:scheme@localhost:5432/schemegpt
      GROQ_API_KEY: ""
      ENABLE_SEMANTIC_CACHE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0

      - name: Install production and test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate evaluation labels and gate logic
        run: python -m pytest tests/test_eval_gate.py tests/test_retrieval_gate.py tests/test_quotes.py -q

      - name: Validate source corpus
        run: python scripts/validate_data.py

      - name: Ingest corpus into pgvector
        run: python -c "from app.ingest import ingest; print(f'ingested_chunks={ingest()}')"

      - name: Evaluate production hybrid retrieval
        run: python -m eval.retrieval_gate

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-${{ github.sha }}
          path: eval/results/retrieval_scores.json
          if-no-files-found: error
          retention-days: 30
